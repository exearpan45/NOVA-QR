<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>
    <linearGradient id="novaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#8a2be2"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="url(#novaGrad)" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Subtle QR grid aesthetic background -->
  <g opacity="0.08" fill="#38bdf8">
    <rect x="60" y="60" width="16" height="16" rx="4"/>
    <rect x="90" y="60" width="16" height="16" rx="4"/>
    <rect x="60" y="90" width="16" height="16" rx="4"/>
    <rect x="436" y="60" width="16" height="16" rx="4"/>
    <rect x="406" y="60" width="16" height="16" rx="4"/>
    <rect x="436" y="90" width="16" height="16" rx="4"/>
    <rect x="60" y="436" width="16" height="16" rx="4"/>
    <rect x="90" y="436" width="16" height="16" rx="4"/>
    <rect x="60" y="406" width="16" height="16" rx="4"/>
  </g>

  <!-- Top-Left QR Corner Eye -->
  <g filter="url(#glow)">
    <rect x="80" y="80" width="112" height="112" rx="24" fill="none" stroke="url(#novaGrad)" stroke-width="14"/>
    <rect x="112" y="112" width="48" height="48" rx="12" fill="url(#novaGrad)"/>
  </g>

  <!-- Top-Right QR Corner Eye -->
  <g filter="url(#glow)">
    <rect x="320" y="80" width="112" height="112" rx="24" fill="none" stroke="url(#novaGrad)" stroke-width="14"/>
    <rect x="352" y="112" width="48" height="48" rx="12" fill="url(#novaGrad)"/>
  </g>

  <!-- Bottom-Left QR Corner Eye -->
  <g filter="url(#glow)">
    <rect x="80" y="320" width="112" height="112" rx="24" fill="none" stroke="url(#novaGrad)" stroke-width="14"/>
    <rect x="112" y="352" width="48" height="48" rx="12" fill="url(#novaGrad)"/>
  </g>

  <!-- Futuristic Data Modules -->
  <rect x="232" y="88" width="48" height="24" rx="8" fill="url(#accentGrad)" opacity="0.85"/>
  <rect x="232" y="136" width="24" height="48" rx="8" fill="url(#accentGrad)" opacity="0.85"/>
  <rect x="88" y="232" width="48" height="24" rx="8" fill="url(#accentGrad)" opacity="0.85"/>
  <rect x="136" y="232" width="48" height="24" rx="8" fill="url(#accentGrad)" opacity="0.85"/>
  <rect x="320" y="232" width="32" height="32" rx="10" fill="url(#accentGrad)" opacity="0.85"/>
  <rect x="376" y="232" width="48" height="24" rx="8" fill="url(#accentGrad)" opacity="0.85"/>
  <rect x="232" y="320" width="24" height="56" rx="8" fill="url(#accentGrad)" opacity="0.85"/>
  <rect x="232" y="400" width="56" height="24" rx="8" fill="url(#accentGrad)" opacity="0.85"/>
  <rect x="320" y="320" width="48" height="24" rx="8" fill="url(#accentGrad)" opacity="0.85"/>
  <rect x="384" y="320" width="48" height="48" rx="12" fill="url(#accentGrad)" opacity="0.85"/>
  <rect x="336" y="384" width="80" height="40" rx="10" fill="url(#accentGrad)" opacity="0.85"/>

  <!-- Center Nova Star / Diamond Flare -->
  <g filter="url(#softGlow)">
    <circle cx="256" cy="256" r="38" fill="#00f2fe" opacity="0.25"/>
    <path d="M256 180 C256 225 225 256 180 256 C225 256 256 287 256 332 C256 287 287 256 332 256 C287 256 256 225 256 180 Z" fill="#ffffff"/>
    <circle cx="256" cy="256" r="12" fill="#38bdf8"/>
    <circle cx="256" cy="256" r="6" fill="#ffffff"/>
  </g>
</svg>
